<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="manifest" href="/project-lighthouse/manifest.json">
<meta name="theme-color" content="#16a6a1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lighthouse">
  
  <title>Lighthouse Push Test</title>

  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

  <style>
    body{
      margin:0;
      min-height:100vh;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      background:#dff7f2;
      color:#253238;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      box-sizing:border-box;
    }

    .card{
      width:min(420px,100%);
      background:#fffdf8;
      border-radius:24px;
      padding:28px 22px;
      box-shadow:0 10px 30px rgba(37,50,56,.12);
      text-align:center;
    }

    button{
      width:100%;
      border:0;
      border-radius:18px;
      padding:16px 18px;
      font-size:18px;
      font-weight:700;
      cursor:pointer;
      background:#16a6a1;
      color:white;
      margin-top:12px;
    }

    #status{
      margin-top:18px;
      font-size:15px;
      line-height:1.5;
    }
  </style>
</head>

<body>
  <div class="card">
    <div style="font-size:64px">🔔</div>
    <h1>Enable Lighthouse reminders</h1>
    <p>This page is only for testing notification setup.</p>

    <button onclick="enablePush()">Turn on reminders</button>

    <div id="status">Waiting...</div>
  </div>

  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];

    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "8a081983-9db8-411b-a922-301fc7e96143",
      });

      const savedUser = localStorage.getItem("lighthouse_user");

      if (savedUser) {
        await OneSignal.login(savedUser);
        document.getElementById("status").textContent =
          "User found: " + savedUser;
      } else {
        document.getElementById("status").textContent =
          "No Lighthouse user is saved on this device.";
      }
    });

    async function enablePush() {
      OneSignalDeferred.push(async function(OneSignal) {
        const savedUser = localStorage.getItem("lighthouse_user");

        if (!savedUser) {
          document.getElementById("status").textContent =
            "Open Laundry first and choose your name.";
          return;
        }

        await OneSignal.login(savedUser);

        if (!OneSignal.Notifications.isPushSupported()) {
          document.getElementById("status").textContent =
            "Push notifications are not supported in this browser.";
          return;
        }

        await OneSignal.Notifications.requestPermission();

        if (OneSignal.Notifications.permission) {
          await OneSignal.User.PushSubscription.optIn();

          document.getElementById("status").textContent =
            "Reminders enabled for " + savedUser + " ✅";
        } else {
          document.getElementById("status").textContent =
            "Notification permission was not granted.";
        }
      });
    }
  </script>
</body>
</html>
